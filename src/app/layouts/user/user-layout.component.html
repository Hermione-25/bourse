<div class="min-h-screen bg-gray-50 lg:flex">
  @if (isMenuOpen) {
    <div class="fixed inset-0 z-40 bg-black/40 lg:hidden" (click)="closeMenu()"></div>
  }

  <aside class="fixed inset-y-0 left-0 z-50 w-64 bg-primary min-h-screen flex flex-col shadow-xl shrink-0 transition-transform duration-300 lg:static lg:translate-x-0"
    [class.translate-x-0]="isMenuOpen"
    [class.-translate-x-full]="!isMenuOpen">
    <div class="px-6 py-5 border-b border-white/10">
      <a routerLink="/" class="flex items-center gap-3" (click)="closeMenu()">
        <div class="w-9 h-9 bg-white/10 rounded-xl flex items-center justify-center">
          <i class="fas fa-graduation-cap text-white text-lg"></i>
        </div>
        <span class="font-bold text-white text-lg tracking-tight">BourseConnect</span>
      </a>
      <p class="text-white/50 text-xs mt-1 ml-12">Espace étudiant</p>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-1">
      <p class="text-white/40 text-[10px] font-bold uppercase tracking-widest px-3 mb-3">Explorer</p>

      <a routerLink="/user/scholarships" routerLinkActive="bg-white/15 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/70 hover:text-white hover:bg-white/10 transition-all text-sm font-medium group"
        (click)="closeMenu()">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-white/10 flex items-center justify-center transition-colors">
          <i class="fas fa-graduation-cap text-sm"></i>
        </div>
        Bourses disponibles
      </a>

      <a routerLink="/user/favoris" routerLinkActive="bg-white/15 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/70 hover:text-white hover:bg-white/10 transition-all text-sm font-medium group"
        (click)="closeMenu()">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-white/10 flex items-center justify-center transition-colors">
          <i class="fas fa-heart text-sm"></i>
        </div>
        Mes favoris
      </a>

      <div class="border-t border-white/10 my-4"></div>
      <p class="text-white/40 text-[10px] font-bold uppercase tracking-widest px-3 mb-3">Compte</p>

      <a routerLink="/user/profil" routerLinkActive="bg-white/15 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/70 hover:text-white hover:bg-white/10 transition-all text-sm font-medium group"
        (click)="closeMenu()">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-white/10 flex items-center justify-center transition-colors">
          <i class="fas fa-user-circle text-sm"></i>
        </div>
        Mon profil
      </a>
    </nav>

    <div class="px-4 py-4 border-t border-white/10">
      <button (click)="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/70 hover:text-white hover:bg-white/10 transition-all text-sm font-medium">
        <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center">
          <i class="fas fa-right-from-bracket text-sm"></i>
        </div>
        Déconnexion
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
    <header class="bg-white border-b border-gray-100 px-4 py-4 flex items-center justify-between shadow-sm lg:px-6">
      <div class="flex items-center gap-3">
        <button type="button" class="rounded-xl border border-gray-200 p-2 text-gray-600 lg:hidden" (click)="toggleMenu()" aria-label="Ouvrir le menu">
          <i class="fas" [class.fa-bars]="!isMenuOpen" [class.fa-times]="isMenuOpen"></i>
        </button>
        <div>
          <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Espace étudiant</p>
          <p class="text-gray-800 font-semibold">BourseConnect</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center text-primary font-bold text-sm">U</div>
      </div>
    </header>

    <div class="flex-1 p-4 overflow-auto lg:p-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
