<div class="min-h-screen bg-gray-50 lg:flex">
  @if (isMenuOpen) {
    <div class="fixed inset-0 z-40 bg-black/40 lg:hidden" (click)="closeMenu()"></div>
  }

  <aside class="fixed inset-y-0 left-0 z-50 w-64 bg-primary min-h-screen flex flex-col shadow-xl shrink-0 transition-transform duration-300 lg:static lg:translate-x-0"
    [class.translate-x-0]="isMenuOpen"
    [class.-translate-x-full]="!isMenuOpen"
    >
    <div class="px-6 py-5 border-b border-white/10 flex flex-col items-center justify-center">
      <div class="w-9 h-9 bg-white/10 rounded-xl flex items-center justify-center">
        <i class="fas fa-graduation-cap text-white text-lg"></i>
      </div>
      <span class="font-bold text-white text-lg tracking-tight">BourseConnect</span>
    </div>

    <nav class="flex-1 py-6 space-y-1">

      <a routerLink="/user/tableau-de-bord" routerLinkActive="bg-white text-primary"
        class="flex items-center gap-3 px-3 py-2.5 text-light/50 hover:text-primary hover:bg-white/10 transition-all text-sm font-medium group"
        (click)="closeMenu()">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-white/10 flex items-center justify-center transition-colors">
          <i class="fas fa-home text-sm"></i>
        </div>
        Tableau de bord 
      </a>

      <a routerLink="/user/favoris" routerLinkActive="bg-white text-primary"
        class="flex items-center gap-3 px-3 py-2.5 text-light/50 hover:text-primary hover:bg-white/10 transition-all text-sm font-medium group"
        (click)="closeMenu()">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-white/10 flex items-center justify-center transition-colors">
          <i class="fas fa-users text-sm"></i>
        </div>
        Mes favoris
      </a>

      <a routerLink="/user/recommandations" routerLinkActive="bg-white text-primary"
        class="flex items-center gap-3 px-3 py-2.5 text-light/50 hover:text-primary hover:bg-white/10 transition-all text-sm font-medium group"
        (click)="closeMenu()">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-white/10 flex items-center justify-center transition-colors">
          <i class="fas fa-graduation-cap text-sm"></i>
        </div>
        Mes recommandations 
      </a>

      <a routerLink="/user/cv" routerLinkActive="bg-white text-primary"
        class="flex items-center gap-3 px-3 py-2.5 text-light/50 hover:text-primary hover:bg-white/10 transition-all text-sm font-medium group"
        (click)="closeMenu()">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-white/10 flex items-center justify-center transition-colors">
          <i class="fas fa-graduation-cap text-sm"></i>
        </div>
        Mes CVs 
      </a>


      <a routerLink="/user/profil" routerLinkActive="bg-white text-primary"
        class="flex items-center gap-3 px-3 py-2.5 text-light/50 hover:text-primary hover:bg-white/10 transition-all text-sm font-medium group"
        (click)="closeMenu()">
        <div class="w-8 h-8 rounded-lg bg-white/5 group-hover:bg-white/10 flex items-center justify-center transition-colors">
          <i class="fas fa-user-circle text-sm"></i>
        </div>
        Mon profil
      </a>
    </nav>

    <div class="px-4 py-4 ">
      <button (click)="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-white/70 hover:text-white hover:bg-white/10 transition-all text-sm font-medium">
        <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center">
          <i class="fas fa-right-from-bracket text-sm"></i>
        </div>
        Déconnexion
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-h-screen overflow-hidden">
    <header class="bg-primary border-b border-gray-100 px-4 py-4 flex items-center justify-between shadow-sm lg:px-6">
      <div class="flex items-center gap-3">
        <button type="button" class="rounded-xl border border-white/20 p-2 text-white lg:hidden" (click)="toggleMenu()" aria-label="Ouvrir le menu">
          <i class="fas" [class.fa-bars]="!isMenuOpen" [class.fa-times]="isMenuOpen"></i>
        </button>
        <div>
          <p class="text-xs text-gray-300 uppercase tracking-wider font-semibold">Utilisateur</p>
        </div>
      </div>
      <div class="text-primary bg-light w-40 h-10 p-2">
          <a routerLink="/"> Retour à l'Accueil</a>
        </div>
    </header>

    <div class="flex-1 p-4 overflow-auto lg:p-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
