<div class="min-h-screen bg-slate-100 text-slate-900">
  <div class="flex min-h-screen flex-col">
    <header class="bg-primary shadow-md">
      <div class="mx-auto flex max-w-7xl items-center justify-between p-4">
        <a routerLink="/" class="font-semibold text-light"><i class="fas fa-graduation-cap text-xl"></i> BourseConnect</a>
        <button 
          type="button"
          (click)="logout()"
          class="rounded px-4 py-2 text-sm font-medium bg-light text-primary hover:bg-black">
          Déconnexion
        </button>
      </div>
    </header>
    
    <div class="flex flex-3">
      <aside class="w-50 shadow-md bg-primary p-4">
        <div class="text-xl font-semibold mb-6">Admin</div>
        <nav class="space-y-3 text-sm">
          <a routerLink="/admin/users" class="block text-light hover:text-slate-900 font-medium hover:bg-light"><i></i> Utilisateurs</a>
          <a routerLink="/" class="block text-light hover:text-slate-900 hover:bg-light"><i></i> Accueil</a>
          <a routerLink="/" class="block text-light hover:text-slate-900 hover:bg-light"><i></i>Profil</a>
        </nav>
      </aside>

      <div class="flex-1 p-6">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
