<div class="min-h-screen bg-slate-100 text-slate-900">
  <div class="flex min-h-screen flex-col">
    <header class="bg-primary shadow-md">
      <div class="mx-auto flex max-w-7xl items-center justify-between p-4">
        <a routerLink="/" class="font-semibold text-light"><i class="fas fa-graduation-cap text-xl"></i> BourseConnect</a>
        <button 
          type="button"
          (click)="logout()"
          class="rounded px-4 py-2 text-sm font-medium bg-light text-primary hover:bg-black/60">
          Déconnexion
        </button>
      </div>
    </header>
    <div class="border-t-2 border-light"></div>
    <div class="flex flex-3">
      <aside class="w-50 shadow-md bg-primary p-4">
        <div class="text-xl font-semibold mb-6">Admin</div>
        <nav class="space-y-10 text-sm">
          <a routerLink="/admin/liste-user" class="block text-light hover:text-slate-900 active:bg-light/40 active:rounded-sm w-full h-10 "><i class="fas fa-user"></i> Utilisateurs</a>
          <a routerLink="/admin/liste-scholarite" class="block text-light hover:text-slate-900 active:bg-light/40 active:rounded-sm w-full h-10 "><i class="fas fa-home"></i>Bourses</a>
          <a routerLink="/admin/profil" class="block text-light hover:text-slate-900 active:bg-light/40 active:rounded-sm w-full h-10 "><i class="fas fa-user"></i>Profil</a>
        </nav>
      </aside>

      <div class="flex-1 p-6">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
