<div class="max-w-2xl mx-auto space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-gray-800">Mon profil</h1>
    <p class="text-sm text-gray-500 mt-1">Informations de votre compte administrateur</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="h-24 bg-light"></div>

  
    <div class="px-6 pb-6">
      <div class="-mt-10 mb-4 flex items-end gap-4">
        <div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold text-lg">
          {{ adminInfo.first_name.charAt(0) }}{{ adminInfo.last_name.charAt(0) }}
        </div>
        
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-1">Email</p>
          <p class="text-sm text-gray-700 font-medium flex items-center gap-2">
            <i class="fas fa-envelope text-primary/60"></i>
            {{ adminInfo.email || 'Non renseigné' }}
          </p>
        </div>
        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider mb-1">Rôle</p>
          <p class="text-sm text-gray-700 font-medium flex items-center gap-2">
            <i class="fas fa-user-tie text-primary/60"></i>
            {{ adminInfo.role }}
          </p>
        </div>
      </div>
    </div>
  </div>


  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
    <h2 class="text-base font-bold text-gray-700">Actions rapides</h2>
    <div class="space-y-2">
      <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 transition-colors text-left text-sm text-gray-700 border border-gray-100">
        <div class="w-9 h-9 bg-blue-100 rounded-lg flex items-center justify-center">
          <i class="fas fa-lock text-blue-600 text-sm"></i>
        </div>
        <div>
          <p class="font-semibold">Changer le mot de passe</p>
          <p class="text-xs text-gray-400">Mettre à jour vos identifiants</p>
        </div>
        <i class="fas fa-chevron-right ml-auto text-gray-300 text-xs"></i>
      </button>
    </div>
  </div>
</div>
