<div class="max-w-sm mx-auto p-4">
  <h1 class="text-2xl font-semibold mb-4 text-light"> <i class="fas fa-key text-light"></i>Modifier Votre Mot de passe</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

    <div>
      <label class="block text-xs font-bold uppercase tracking-[1px] text-light mb-2" for="password">Nouveau Mot de passe</label>
      <input id="password" type="password" formControlName="password" class="w-full rounded-lg border border-border-color px-4 py-2 text-sm text-dark focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-light/50" />
      <div *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')" class="text-red-600 text-sm mt-1">Le mot de passe doit contenir au moins 8 caractères.</div>
    </div>

    <div>
      <label class="block text-xs font-bold uppercase tracking-[1px] text-light mb-2" for="password_confirmation">Confirmer le nouveau Mot de passe</label>
      <input id="password_confirmation" type="password" formControlName="password_confirmation" class="w-full rounded-lg border border-border-color px-4 py-2 text-sm text-dark focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-light/50" />
      <div *ngIf="form.hasError('passwordMismatch') && form.get('password_confirmation')?.touched" class="text-red-600 text-sm mt-1">Les mots de passe ne correspondent pas.</div>
    </div>

    <div *ngIf="successMessage" class="text-green-600">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="text-red-600">{{ errorMessage }}</div>

    <button type="submit" class="w-full mt-2 inline-flex items-center justify-center px-5 py-3 rounded-lg text-sm font-semibold cursor-pointer transition-all duration-300 border-none no-underline bg-primary text-white shadow-[0_4px_12px] shadow-primary/20 hover:opacity-90 hover:-translate-y-[1px]" [disabled]="submitting">
      {{ submitting ? 'Modification en cours...' : 'Modifier mon mot de passe' }}
    </button>
  </form>
</div>
