<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="flex items-center gap-2 bg-transparent border-none text-light outline-none cursor-pointer"
    [class.text-black]="hasValue()"
    [class.text-black/70] ="!hasValue()"
  >
    <i class="fas {{ icon() }} text-xl"></i>
    <span class="whitespace-nowrap">{{ selectedLabel() }}</span>
    <i
      class="fas fa-chevron-down text-xs transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    ></i>
  </button>

  @if (isOpen()) {
    <ul
      class="absolute top-full left-0 mt-2 min-w-[180px] bg-white rounded-lg shadow-[0_8px_24px_rgba(0,0,0,0.12)] py-2 z-50 max-h-64 overflow-auto"
    >
      @for (option of options(); track option.value) {
        <li>
          <button
            type="button"
            (click)="select(option)"
            class="w-full text-left px-4 py-2 text-sm text-black hover:bg-black/60 hover:text-light transition-colors"
            [class.text-black]="option.value === value()"
            [class.font-semibold]="option.value === value()"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
